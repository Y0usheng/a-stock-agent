name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-publication:
    name: tests-and-publication
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Scan repository and reachable history
        run: python scripts/check_repository_secrets.py --history
      - name: Run tests without model credentials
        run: python -m unittest discover -s tests -v
      - name: Validate an empty public archive build
        run: python scripts/publish_reports.py build --source /tmp/empty-public-reports --output /tmp/pages-check
